<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="src/style.css" />

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

    <title>Debby Weather App</title>
  </head>

  <body>
    <div class="weather-app">

      <!-- HEADER -->
      <header>
        <form id="search-form" class="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            id="search-form-input"
            class="search-form-input"
            required
          />
          <input
            type="submit"
            value="Search"
            class="search-form-button"
          />
        </form>
      </header>

      <!-- MAIN -->
      <main>

        <!-- CURRENT WEATHER -->
        <div class="weather-app-data">
          <div>
            <h1 id="city" class="weather-app-city"></h1>

            <p class="weather-app-details">
              <span id="time"></span>,
              <span id="description"></span>
              <br />
              Humidity: <strong id="humidity"></strong>,
              Wind: <strong id="wind-speed"></strong>
            </p>
          </div>

          <div class="weather-app-temperature-container">
            <div id="icon"></div>
            <div id="temperature" class="weather-app-temperature"></div>
            <div class="weather-app-unit">°C</div>
          </div>
        </div>

        <!-- FORECAST (JS WILL FILL THIS) -->
        <div id="forecast" class="weather-forecast"></div>

      </main>

      <!-- FOOTER -->
      <footer>
        <p>
          This project was coded by
          <a href="https://www.linkedin.com/in/deborah-muyongo-4143b2289?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank">
            Deborah Muyongo
          </a>
          and is
          <a href="https://github.com/" target="_blank">
            on GitHub
          </a>
          and hosted on
          <a href="https://netlify.com/" target="_blank">
            Netlify
          </a>
        </p>
      </footer>

    </div>

    <!-- JS -->
    <script src="src/index.js"></script>
  </body>
</html>
